name: bayna_chuktigari
description: "DealDone - 100% Offline-First Legal Agreement & Receipt Generator for Bangladesh"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  intl: ^0.19.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^3.0.0
  test: ^1.24.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/HindSiliguri/
    - assets/images/
  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri/HindSiliguri-Bold.ttf
          weight: 700
